name: Build VisualGram IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init submodules
      run: |
        git submodule update --init --recursive
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: url.https://github.com/TelegramMessenger/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/fragmentusa/

    - name: Select Xcode
      run: |
        ls /Applications/ | grep Xcode
        XCODE=$(ls /Applications/ | grep "^Xcode" | sort -r | head -1)
        sudo xcode-select -s "/Applications/$XCODE"
        xcodebuild -version

    - name: Install Python deps
      run: pip3 install pyaml --break-system-packages || pip3 install pyaml

    - name: Setup build config
      run: |
        cat > buildConfig.json << 'CONF'
        {
          "bundle_id": "org.blackgram.app",
          "api_id": "2040",
          "api_hash": "b18441a1ff607e10a989891a5462e627",
          "team_id": "BLACKGRAM1",
          "app_center_id": 0,
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "blackgram"
        }
        CONF

    - name: Build
      run: |
        python3 build-system/Make/Make.py \
          --cacheDir=$HOME/cache \
          build \
          --configurationPath=buildConfig.json \
          --buildNumber=1 \
          --configuration=release_arm64
      continue-on-error: true

    - name: Find and package IPA
      run: |
        APP=$(find $HOME -name "*.app" 2>/dev/null | grep -v Simulator | head -1)
        if [ -n "$APP" ]; then
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r BlackGram.ipa Payload/
          echo "IPA created: BlackGram.ipa"
        else
          echo "No .app found, trying DerivedData..."
          APP2=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | grep -v Simulator | head -1)
          if [ -n "$APP2" ]; then
            mkdir -p Payload
            cp -r "$APP2" Payload/
            zip -r BlackGram.ipa Payload/
          else
            echo "Still no .app found"
          fi
        fi
      continue-on-error: true

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGram-IPA
        path: BlackGram.ipa
        if-no-files-found: warn
