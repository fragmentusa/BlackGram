
name: Build BlackGram IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 2. Configure Git URLs
      - name: Configure Git URLs
        run: |
          git config --global \
            url."https://github.com/TelegramMessenger/".insteadOf \
            "https://github.com/fragmentusa/"

      # 3. Initialize submodules
      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 4. Check submodules
      - name: Check submodules
        run: |
          git submodule status --recursive

      # 5. Xcode
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      # 6. Python dependencies
      - name: Install Python dependencies
        run: |
          python3 -m pip install pyaml --break-system-packages

      # 7. Build configuration
      - name: Setup build config
        run: |
          cat > buildConfig.json <<'CONF'
          {
            "bundle_id": "org.blackgram.app",
            "api_id": "2040",
            "api_hash": "b18441a1ff607e10a989891a5462e627",
            "team_id": "",
            "app_center_id": 0,
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "blackgram",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          CONF

      # 8. Build BlackGram
      - name: Build BlackGram
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=buildConfig.json \
            --buildNumber=1 \
            --configuration=release_arm64 \
            --xcodeManagedCodesigning

      # 9. Find application
      - name: Find Telegram.app
        run: |
          APP=$(find . "$HOME/cache" \
            -type d -name "Telegram.app" \
            -not -path "*Simulator*" \
            2>/dev/null | head -1)

          if [ -z "$APP" ]; then
            APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d -name "Telegram.app" \
              -not -path "*Simulator*" \
              2>/dev/null | head -1)
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: Telegram.app not found"
            exit 1
          fi

          echo "Found: $APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # 10. Package IPA
      - name: Package IPA
        run: |
          rm -rf Payload BlackGram.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Telegram.app

          /usr/bin/zip -qry BlackGram.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh BlackGram.ipa

      # 11. Upload IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlackGram-IPA
          path: BlackGram.ipa
          if-no-files-found: error
          retention-days: 7
