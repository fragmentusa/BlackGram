name: Build VisualGram IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init submodules
      run: |
        git submodule update --init --recursive
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: url.https://github.com/TelegramMessenger/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/fragmentusa/

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Patch Xcode version check
      run: |
        CURRENT=$(xcodebuild -version | head -1 | awk '{print $2}')
        echo "Current Xcode: $CURRENT"
        
        find build-system/ -name "*.py" | while read f; do
          if grep -q "27\.1" "$f" 2>/dev/null; then
            echo "Patching: $f"
            sed -i '' "s/27\.1/$CURRENT/g" "$f"
          fi
        done
        
        echo "Checking remaining 27.1 refs:"
        grep -r "27\.1" build-system/ 2>/dev/null || echo "None found - patch successful"

    - name: Install Python deps
      run: pip3 install pyaml --break-system-packages || pip3 install pyaml

    - name: Setup build config
      run: |
        cat > buildConfig.json << 'CONF'
        {
          "bundle_id": "org.blackgram.app",
          "api_id": "2040",
          "api_hash": "b18441a1ff607e10a989891a5462e627",
          "team_id": "BLACKGRAM1",
          "app_center_id": 0,
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "blackgram"
        }
        CONF

    - name: Build
      run: |
        python3 build-system/Make/Make.py \
          --cacheDir=$HOME/cache \
          build \
          --configurationPath=buildConfig.json \
          --buildNumber=1 \
          --configuration=release_arm64 \
          --xcodeManagedCodesigning
      continue-on-error: true

    - name: Find and package IPA
      run: |
        echo "=== Searching for Telegram.app ==="
        APP=$(find . -name "Telegram.app" 2>/dev/null | grep -v Simulator | head -1)
        
        if [ -z "$APP" ]; then
          APP=$(find $HOME/cache -name "Telegram.app" 2>/dev/null | grep -v Simulator | head -1)
        fi

        if [ -z "$APP" ]; then
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Telegram.app" 2>/dev/null | grep -v Simulator | head -1)
        fi
        
        if [ -z "$APP" ]; then
          APP=$(find $HOME -name "*.app" 2>/dev/null \
            | grep -v Simulator \
            | grep -v "group.is" \
            | grep -v "workflow" \
            | grep -v "monitor" \
            | grep -v "/System/" \
            | grep -v "CoreSimulator" \
            | head -1)
        fi
        
        if [ -n "$APP" ]; then
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r BlackGram.ipa Payload/
          echo "IPA created"
          ls -la BlackGram.ipa
        else
          echo "No .app found"
          find $HOME -name "*.app" 2>/dev/null | grep -v Simulator | head -20
        fi
      continue-on-error: true

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGram-IPA
        path: BlackGram.ipa
        if-no-files-found: warn
