name: Build VisualGram IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init submodules
      run: git submodule update --init --recursive
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: url.https://github.com/TelegramMessenger/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/fragmentusa/

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Fix BUILD file
      run: |
        python3 -c "
        import re
        content = open('Telegram/BUILD').read()
        fixed = re.sub(r'provisioning_profile = select\(\{[^\)]+Intents\.mobileprovision[^\)]+\}\),\s*\n\s*provisioning_profile', 'provisioning_profile', content)
        open('Telegram/BUILD', 'w').write(fixed)
        print('Done')
        "

    - name: Install Python deps
      run: pip3 install pyaml --break-system-packages || true

    - name: Setup build config
      run: |
        cat > buildConfig.json << EOF
        {
          "bundle_id": "org.blackgram.app",
          "api_id": "2040",
          "api_hash": "b18441a1ff607e10a989891a5462e627",
          "team_id": "BLACKGRAM1",
          "app_center_id": 0,
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "blackgram"
        }
        EOF

    - name: Build
      run: |
        python3 build-system/Make/Make.py \
          --overrideXcodeVersion \
          --cacheDir=$HOME/cache \
          --bazelArguments="--//Telegram:disableProvisioningProfiles=true" \
          build \
          --configurationPath=buildConfig.json \
          --buildNumber=1 \
          --configuration=release_arm64 \
          --xcodeManagedCodesigning
      continue-on-error: true

    - name: Find and package IPA
      run: |
        APP=$(find . $HOME/cache ~/Library/Developer/Xcode/DerivedData \
          -name "Telegram.app" 2>/dev/null \
          | grep -v Simulator | head -1)
        if [ -z "$APP" ]; then
          APP=$(find $HOME -name "*.app" 2>/dev/null \
            | grep -v Simulator \
            | grep -v "group.is\|workflow\|monitor\|/System/\|CoreSimulator" \
            | head -1)
        fi
        if [ -n "$APP" ]; then
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r BlackGram.ipa Payload/
          ls -la BlackGram.ipa
        else
          echo "No app found"
          find $HOME -name "*.app" 2>/dev/null | grep -v Simulator | head -10
        fi
      continue-on-error: true

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGram-IPA
        path: BlackGram.ipa
        if-no-files-found: warn
