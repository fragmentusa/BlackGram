name: Build VisualGram IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init submodules
      run: |
        git submodule update --init --recursive
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: url.https://github.com/TelegramMessenger/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/fragmentusa/

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Fix BUILD file
      run: |
        python3 << 'PYEOF'
        with open('Telegram/BUILD', 'r') as f:
            content = f.read()
        
        # Fix duplicate provisioning_profile in NotificationContentExtension
        bad = """    provisioning_profile = select({
        ":disableProvisioningProfilesSetting": None,
        "//conditions:default": "@build_configuration//provisioning:Intents.mobileprovision",
    }),
    provisioning_profile = select({
        ":disableProvisioningProfilesSetting": None,
        "//conditions:default": "@build_configuration//provisioning:NotificationContent.mobileprovision",
    }),"""
        
        good = """    provisioning_profile = select({
        ":disableProvisioningProfilesSetting": None,
        "//conditions:default": "@build_configuration//provisioning:NotificationContent.mobileprovision",
    }),"""
        
        if bad in content:
            content = content.replace(bad, good)
            print("Fixed duplicate provisioning_profile")
        else:
            print("Pattern not found, trying alternative fix...")
            # Alternative: remove any double provisioning_profile occurrences
            import re
            content = re.sub(
                r'(provisioning_profile = select\(\{[^}]+Intents\.mobileprovision[^}]+\}\),)\s*\n(\s*provisioning_profile)',
                r'\2',
                content
            )
        
        with open('Telegram/BUILD', 'w') as f:
            f.write(content)
        
        # Verify fix
        if 'duplicate keyword argument' not in content:
            print("BUILD file looks clean")
        PYEOF

    - name: Install Python deps
      run: pip3 install pyaml --break-system-packages || pip3 install pyaml

    - name: Setup build config
      run: |
        cat > buildConfig.json << 'CONF'
        {
          "bundle_id": "org.blackgram.app",
          "api_id": "2040",
          "api_hash": "b18441a1ff607e10a989891a5462e627",
          "team_id": "BLACKGRAM1",
          "app_center_id": 0,
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "blackgram"
        }
        CONF

    - name: Build
      run: |
        python3 build-system/Make/Make.py \
          --cacheDir=$HOME/cache \
          build \
          --configurationPath=buildConfig.json \
          --buildNumber=1 \
          --configuration=release_arm64 \
          --xcodeManagedCodesigning \
          --overrideXcodeVersion \
          --disableProvisioningProfiles
      continue-on-error: true

    - name: Find and package IPA
      run: |
        echo "=== Searching for Telegram.app ==="
        APP=$(find . -name "Telegram.app" 2>/dev/null | grep -v Simulator | head -1)
        if [ -z "$APP" ]; then
          APP=$(find $HOME/cache -name "Telegram.app" 2>/dev/null | grep -v Simulator | head -1)
        fi
        if [ -z "$APP" ]; then
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Telegram.app" 2>/dev/null | grep -v Simulator | head -1)
        fi
        if [ -z "$APP" ]; then
          APP=$(find $HOME -name "*.app" 2>/dev/null \
            | grep -v Simulator \
            | grep -v "group.is" \
            | grep -v "workflow" \
            | grep -v "monitor" \
            | grep -v "/System/" \
            | grep -v "CoreSimulator" \
            | head -1)
        fi
        if [ -n "$APP" ]; then
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r BlackGram.ipa Payload/
          echo "IPA created"
          ls -la BlackGram.ipa
        else
          echo "No .app found"
          find $HOME -name "*.app" 2>/dev/null | grep -v Simulator | head -20
        fi
      continue-on-error: true

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BlackGram-IPA
        path: BlackGram.ipa
        if-no-files-found: warn
